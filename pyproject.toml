[project]
name = "comment-radar"
version = "0.1.0"
description = "Finds groups of accounts that act together in a YouTube comment section."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "google-cloud-aiplatform>=1.40.0",
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "numpy>=2.0",
    "openai-agents[litellm]>=0.24",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "transformers>=4.45",
    "uvicorn>=0.27.0",
    "vadersentiment>=3.3.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

# Cloud Run has no GPU: on Linux take the CPU-only torch build, which is about 1.5 GB smaller.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
